<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#173e32">
	<meta name="description" content="Fresh seasonal produce, grown by nearby farmers and delivered with care. Shop directly from Indian farms on Farm2Door.">
	<title>Farm2Door | Fresh produce, closer to home</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="/css/style.css" rel="stylesheet">
</head>
<body>
	<div class="announcement-bar"><span class="announcement-mark"></span> Harvested nearby. Shared fairly. Delivered fresh.</div>
	<nav class="navbar navbar-expand-lg site-nav" aria-label="Main navigation">
		<div class="container nav-inner">
			<a class="navbar-brand brand-lockup" href="#home" aria-label="Farm2Door home">
				<span class="brand-icon"><i class="bi bi-leaf-fill"></i></span>
				<span class="brand-wordmark">farm<span>2</span>door<small>GROWN CLOSER</small></span>
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="mainNav">
				<div class="navbar-nav mx-auto nav-links">
					<a class="nav-link" href="#home">Home</a>
					<a class="nav-link" href="#shop">Shop produce</a>
					<a class="nav-link" href="#about">Our story</a>
					<a class="nav-link" href="#how-it-works">How it works</a>
				</div>
				<div class="nav-actions">
					<a class="nav-icon-link" href="#cart" aria-label="Shopping cart"><i class="bi bi-bag"></i><span id="cart-count" class="cart-count">0</span></a>
					<span id="nav-account"></span>
				</div>
			</div>
		</div>
	</nav>
	<main id="app" aria-live="polite"><div class="page-loading"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Opening the market...</div></main>
	<script>
		if (window.location.protocol === 'file:') {
			document.querySelector('#app').innerHTML = '<section style="max-width:680px;margin:64px auto;padding:32px 24px;font-family:Arial,sans-serif;color:#173e32"><p style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">Farm2Door local setup</p><h1 style="font-size:30px;line-height:1.2">Start the marketplace server to continue.</h1><p style="color:#59685e;line-height:1.7">This page needs its local Express server for styling, products, sign-in, and orders. In the project folder, double-click <strong>start.bat</strong> or run <code>npm.cmd run dev</code> in the VS Code terminal.</p><p><a style="display:inline-block;padding:12px 16px;background:#173e32;color:white;text-decoration:none" href="http://localhost:3000">Open Farm2Door</a></p></section>';
		}
	</script>
	<div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/app.js" defer></script>
</body>
</html>
